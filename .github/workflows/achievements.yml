name: Update achievements

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: achievements
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Refresh achievements
        run: python .github/scripts/update_achievements.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- README.md assets/achievements)" ]; then
            echo "Achievements are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md assets/achievements
          git commit -m "chore: update achievements"
          git push
